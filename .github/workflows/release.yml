name: Build signed GitHub release APK

run-name: Build signed APK for ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable vMAJOR.MINOR.PATCH tag at the selected main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag and signing configuration
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SIGNING_SHA256: ${{ vars.MAEKSTER_RELEASE_CERT_SHA256 }}
          KEYSTORE: ${{ secrets.MAEKSTER_RELEASE_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.MAEKSTER_RELEASE_KEYPROPERTIES_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MAEKSTER_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MAEKSTER_RELEASE_KEY_PASSWORD }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          test "$RELEASE_TAG" = "v$version"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$GITHUB_SHA"
          [[ "$SIGNING_SHA256" =~ ^[[:xdigit:]]{64}$ ]]
          test -n "$KEYSTORE" && test -n "$KEY_PROPERTIES" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD"
      - id: build
        uses: ./.github/actions/build
        with:
          gradle-args: ":app:assembleRelease --no-daemon"
          sign: "true"
          keystore-base64: ${{ secrets.MAEKSTER_RELEASE_KEYSTORE_BASE64 }}
          keyproperties-base64: ${{ secrets.MAEKSTER_RELEASE_KEYPROPERTIES_BASE64 }}
          keystore-password: ${{ secrets.MAEKSTER_RELEASE_STORE_PASSWORD }}
          key-password: ${{ secrets.MAEKSTER_RELEASE_KEY_PASSWORD }}
      - name: Verify the APK and prepare release assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SIGNING_SHA256: ${{ vars.MAEKSTER_RELEASE_CERT_SHA256 }}
          VERSION_CODE: ${{ steps.build.outputs.version-code }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          nix develop --command bash tools/verify-release-apk.sh "$apk" "$SIGNING_SHA256" "$VERSION_CODE" "${RELEASE_TAG#v}"
          mkdir -p dist
          cp "$apk" dist/maekster.apk
          (cd dist && sha256sum maekster.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: maekster-release-apk
          path: dist/
          if-no-files-found: error
